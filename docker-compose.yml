services:
  app:
    build: .
    container_name: front_tienda_01
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:3000
      - PORT=5173
    networks:
      - app-network
    
networks:
  app-network:
    driver: bridge